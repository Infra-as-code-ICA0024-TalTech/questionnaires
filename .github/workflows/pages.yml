name: Validate and publish Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Validate questions and exports
        run: uv run scripts/build.py --check
      - name: Assemble site
        run: |
          mkdir -p public
          cp -r self-check public/self-check
          mkdir -p public/assets && cp -r assets/fonts public/assets/fonts
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=self-check/"><title>ICA0024 self-check</title><a href="self-check/">ICA0024 self-check questions</a>\n' > public/index.html
      - name: Configure Pages
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
